<!doctype html><meta charset=utf-8><body style="margin:0;background:#9fd0f0"><canvas id=c width=1600 height=500></canvas>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"}}</script>
<script type=module>
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
const files=JSON.parse(decodeURIComponent(location.hash.slice(1)));
const r=new THREE.WebGLRenderer({canvas:c,antialias:true});r.setSize(1600,500,false);r.outputColorSpace=THREE.SRGBColorSpace;
const s=new THREE.Scene();s.background=new THREE.Color(0x9fd0f0);
s.add(new THREE.HemisphereLight(0xffffff,0x887766,1.6));const d=new THREE.DirectionalLight(0xffffff,1.6);d.position.set(2,5,6);s.add(d);
const cam=new THREE.OrthographicCamera(-files.length*0.55,files.length*0.55,1.3,-0.1,0.1,50);cam.position.set(0,0.9,8);
const L=new GLTFLoader();let i=0;const info=[];
for(const f of files){L.load(f,g=>{const m=g.scene;const b=new THREE.Box3().setFromObject(m);const h=b.max.y-b.min.y;const k=1.7/h;m.scale.setScalar(k);const b2=new THREE.Box3().setFromObject(m);m.position.set((files.indexOf(f)-(files.length-1)/2)*1.1-(b2.min.x+b2.max.x)/2,-b2.min.y,0);s.add(m);
 info.push(f.split('/').pop()+' h='+h.toFixed(2)+' w='+(b.max.x-b.min.x).toFixed(2)); if(info.length===files.length){r.render(s,cam);window.__done=info}},undefined,e=>{info.push('ERR '+f);if(info.length===files.length)window.__done=info})}
</script>
