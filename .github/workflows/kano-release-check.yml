name: Kano Life Release Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  release-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
      - name: Install locked dependencies
        run: npm ci
      - name: Verify source project
        run: npm run release:verify
      - name: Run test suite
        run: npm test
      - name: Build production site
        run: npm run build
      - name: Verify built deployment output
        run: npm run release:verify:dist
