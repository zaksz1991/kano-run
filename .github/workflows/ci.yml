name: Kano Life CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: kano-life-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
      - name: Install locked dependencies
        run: npm ci
      - name: Check JavaScript syntax
        run: npm run check
      - name: Run all unit and integration tests
        run: npm test
      - name: Build production site
        run: npm run build
      - name: Verify built deployment output
        run: npm run release:verify:dist
