<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0a0f1c" />
  <title>Kano Run — 3D Adaidaita Sahu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <div id="game-container">
    <canvas id="c"></canvas>

    <div id="ui-overlay">
      <div class="top-bar">
        <div class="stat money">₦ <span id="score">0</span></div>
        <div class="stat dist"><span id="dist">0.0</span> km</div>
        <div class="stat pax">👥 <span id="pax">0</span>/<span id="capacity">3</span></div>
        <div class="stat" style="color:#f87171">❤️ <span id="lives">3</span></div>
      </div>
      <div class="mission-bar" id="mission-label">🎯 Ready</div>
      <div id="route-label"></div>
      <div id="combo-display"></div>
      <div id="mission-toast"></div>
      <div id="event-box">
        <div id="event-title"></div>
        <div id="event-text"></div>
        <div id="event-choices"></div>
      </div>
    </div>

    <div id="controls">
      <button class="ctrl-btn" id="left-btn" type="button">←</button>
      <button class="ctrl-btn horn" id="horn-btn" type="button">HORN</button>
      <button class="ctrl-btn" id="right-btn" type="button">→</button>
    </div>

    <div class="screen" id="start-screen">
      <h1>KANO RUN</h1>
      <div class="sub">3D Adaidaita · Kano State</div>
      <button class="btn" id="start-btn" type="button">START DRIVING</button>
      <button class="btn secondary" id="route-btn" type="button">SELECT ROUTE</button>
      <div class="high">High Score: ₦ <span id="hs">0</span></div>
      <div class="instructions">
        Pick up passengers · Drop for fare<br />
        Dodge traffic · 3 free Life Savers
      </div>
      <div id="sponsor-strip">
        <div>Sponsored</div>
        <a href="https://ruffneck-entertainment.vercel.app" target="_blank" rel="noopener">🎬 Ruffneck Entertainment</a>
        <a href="https://ruffneck-lms.vercel.app" target="_blank" rel="noopener">📚 Ruffneck LMS</a>
      </div>
    </div>

    <div class="screen" id="route-screen" style="display:none">
      <h2 style="color:#f5c542;margin-bottom:12px">Select Route</h2>
      <div id="route-list" class="route-panel"></div>
      <button class="btn secondary" id="route-back" type="button">Back</button>
    </div>

    <div class="screen" id="over-screen" style="display:none">
      <h2>Run Over</h2>
      <div id="final-stats"></div>
      <div class="high">High Score: ₦ <span id="final-hs">0</span></div>
      <button class="btn" id="retry-btn" type="button">DRIVE AGAIN</button>
      <button class="btn secondary" id="home-btn" type="button">HOME</button>
      <div id="sponsor-over">
        <a href="https://ruffneck-entertainment.vercel.app" target="_blank" rel="noopener">🎬 Ruffneck Entertainment</a>
        <a href="https://ruffneck-lms.vercel.app" target="_blank" rel="noopener">📚 Ruffneck LMS</a>
      </div>
    </div>
  </div>
  <script type="module" src="/js/main.js"></script>
</body>
</html>
