<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1220" />
  <title>Kano Run — Adaidaita Sahu</title>
  <link rel="stylesheet" href="/css/styles.css" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      height: 100%; height: 100dvh; overflow: hidden;
      background: #0b1220;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      color: #f1f5f9;
    }
    #game-container { position: fixed; inset: 0; }
    #c { width: 100%; height: 100%; display: block; touch-action: none; }

    #loading-screen {
      position: fixed; inset: 0; z-index: 1000;
      display: flex; align-items: center; justify-content: center;
      padding: 24px;
      background: radial-gradient(ellipse at 50% 30%, #152238 0%, #0b1220 70%);
      transition: opacity 0.4s ease, visibility 0.4s ease;
    }
    #loading-screen.hidden { opacity: 0; visibility: hidden; pointer-events: none; }

    .panel {
      width: min(380px, 100%);
      text-align: center;
    }
    .badge {
      display: inline-block; margin-bottom: 12px;
      padding: 5px 12px; border-radius: 999px;
      border: 1px solid rgba(251,191,36,0.4);
      color: #fbbf24; font-size: 11px; font-weight: 800; letter-spacing: 1px;
    }
    .game-title {
      font-size: clamp(36px, 10vw, 56px); font-weight: 900; letter-spacing: -1px;
      background: linear-gradient(180deg, #fff 0%, #fbbf24 100%);
      -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
    }
    .subtitle {
      margin-top: 6px; font-size: 12px; font-weight: 700;
      color: #38bdf8; letter-spacing: 0.3em; text-transform: uppercase;
    }
    .tagline {
      margin: 14px auto 20px; font-size: 14px; color: #94a3b8; line-height: 1.5; max-width: 300px;
    }
    .start-button {
      width: 100%; min-height: 52px; border: 0; border-radius: 12px;
      background: linear-gradient(135deg, #fbbf24, #f59e0b);
      color: #1c1917; font-size: 16px; font-weight: 900; cursor: pointer;
    }
    .start-button:disabled { opacity: 0.7; cursor: wait; }
    #load-status { margin-top: 10px; font-size: 12px; color: #64748b; min-height: 16px; }
    #load-status.active { color: #38bdf8; }
    .row-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
    .ghost-btn {
      min-height: 42px; border-radius: 10px;
      border: 1px solid #334155; background: rgba(15,23,42,0.8);
      color: #e2e8f0; font-weight: 700; font-size: 13px; cursor: pointer;
    }
    .loading-bar {
      margin-top: 14px; height: 4px; border-radius: 999px;
      background: rgba(255,255,255,0.08); overflow: hidden;
    }
    .loading-progress {
      height: 100%; width: 0%;
      background: linear-gradient(90deg, #fbbf24, #38bdf8);
      transition: width 0.2s ease;
    }
    .developer {
      margin-top: 18px; font-size: 10px; color: #475569;
      letter-spacing: 0.15em; text-transform: uppercase;
    }
  </style>
</head>
<body>
  <div id="loading-screen">
    <div class="panel">
      <div class="badge">KANO · ADAIDAITA SAHU</div>
      <h1 class="game-title">KANO RUN</h1>
      <p class="subtitle">Drive · Earn · Survive</p>
      <p class="tagline">Negotiate fares. Beat traffic. KAROTA checkpoints. New drivers start with ₦30,000.</p>
      <button class="start-button" id="start-btn" type="button">START DRIVING</button>
      <p id="load-status">Tap start when ready</p>
      <div class="row-btns">
        <button class="ghost-btn" id="btn-garage" type="button">Garage</button>
        <button class="ghost-btn" id="btn-naija" type="button">Naija Challenge</button>
      </div>
      <div class="loading-bar"><div class="loading-progress" id="loading-progress"></div></div>
      <div class="developer">Ruffneck Entertainment</div>
    </div>
  </div>
  <div id="game-container"><canvas id="c"></canvas></div>
  <script type="module">
    document.getElementById("btn-garage")?.addEventListener("click", () =>
      window.dispatchEvent(new CustomEvent("kano:open-garage")));
    document.getElementById("btn-naija")?.addEventListener("click", () =>
      window.dispatchEvent(new CustomEvent("kano:open-naija")));
  </script>
  <script type="module" src="/js/core/Main.js"></script>
</body>
</html>
