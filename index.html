<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#0a1628" />
  <title>Kano Run — Adaidaita Sahu</title>
  <link rel="stylesheet" href="/css/styles.css" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background: #0a1628;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      color: #f8fafc;
      touch-action: none;
    }
    #game-container { position: fixed; inset: 0; }
    #c { width: 100%; height: 100%; display: block; touch-action: none; }

    /* Full-bleed title layer */
    #loading-screen {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: stretch;
      padding: 0;
      transition: opacity 0.45s ease, visibility 0.45s ease;
    }
    #loading-screen.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .hero {
      position: absolute;
      inset: 0;
      background:
        linear-gradient(180deg, rgba(10,22,40,0.35) 0%, rgba(10,22,40,0.55) 40%, rgba(10,22,40,0.95) 78%, #0a1628 100%),
        url("/assets/models/brand/keke-street.webp") center/cover no-repeat,
        radial-gradient(ellipse at 30% 20%, #1e3a5f 0%, #0a1628 70%);
    }
    .hero::after {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 70% 30%, rgba(251,191,36,0.12), transparent 45%);
      pointer-events: none;
    }

    .sheet {
      position: relative;
      z-index: 2;
      padding: max(20px, env(safe-area-inset-top)) 20px max(28px, env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 12px;
      border-radius: 999px;
      background: rgba(251,191,36,0.15);
      border: 1px solid rgba(251,191,36,0.35);
      color: #fbbf24;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    .game-title {
      font-size: clamp(42px, 12vw, 72px);
      font-weight: 900;
      letter-spacing: -2px;
      line-height: 0.95;
      text-align: center;
      text-shadow: 0 8px 40px rgba(0,0,0,0.5);
    }
    .game-title span {
      display: block;
      background: linear-gradient(90deg, #fff 0%, #fbbf24 55%, #fde68a 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      font-size: 13px;
      font-weight: 700;
      color: #38bdf8;
      letter-spacing: 4px;
      text-transform: uppercase;
    }

    .tagline {
      font-size: 14px;
      color: #94a3b8;
      text-align: center;
      max-width: 340px;
      line-height: 1.5;
    }

    .start-button {
      width: min(360px, 100%);
      min-height: 56px;
      margin-top: 6px;
      padding: 16px 24px;
      font-size: 17px;
      font-weight: 900;
      border: none;
      border-radius: 14px;
      background: linear-gradient(135deg, #fbbf24 0%, #f59e0b 50%, #ea580c 100%);
      color: #1c1917;
      cursor: pointer;
      letter-spacing: 1px;
      text-transform: uppercase;
      box-shadow: 0 12px 32px rgba(245,158,11,0.35);
      transition: transform 0.15s ease, box-shadow 0.15s ease, filter 0.15s;
    }
    .start-button:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 16px 40px rgba(245,158,11,0.45);
    }
    .start-button:active:not(:disabled) { transform: scale(0.98); }
    .start-button:disabled {
      filter: grayscale(0.2) brightness(0.9);
      cursor: wait;
    }

    .status {
      font-size: 12px;
      color: #64748b;
      min-height: 18px;
      text-align: center;
    }
    .status.active { color: #38bdf8; }

    .row-btns {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      width: min(360px, 100%);
    }
    .ghost-btn {
      min-height: 46px;
      border-radius: 12px;
      border: 1px solid rgba(148,163,184,0.35);
      background: rgba(15,23,42,0.55);
      backdrop-filter: blur(8px);
      color: #e2e8f0;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
    }
    .ghost-btn:active { background: rgba(30,41,59,0.8); }

    .loading-bar {
      width: min(360px, 100%);
      height: 5px;
      background: rgba(255,255,255,0.08);
      border-radius: 999px;
      overflow: hidden;
    }
    .loading-progress {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #fbbf24, #38bdf8);
      border-radius: 999px;
      transition: width 0.25s ease;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      font-size: 11px;
      color: #64748b;
    }
    .control-key {
      padding: 5px 10px;
      border-radius: 8px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.08);
    }

    .developer {
      font-size: 10px;
      color: #475569;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-top: 4px;
    }

    @media (min-width: 768px) {
      .sheet { padding-bottom: 48px; }
      .game-title { font-size: 80px; }
    }
  </style>
</head>
<body>
  <div id="loading-screen">
    <div class="hero" aria-hidden="true"></div>
    <div class="sheet">
      <div class="badge">Naija · Kano streets</div>
      <h1 class="game-title"><span>KANO RUN</span></h1>
      <p class="subtitle">Adaidaita Sahu</p>
      <p class="tagline">Negotiate fares. Dodge okada. Beat KAROTA. Hausa · Yoruba · Igbo challenge.</p>

      <button class="start-button" id="start-btn" type="button">START DRIVING</button>
      <p class="status" id="load-status">Tap start when ready</p>

      <div class="row-btns">
        <button class="ghost-btn" id="btn-garage" type="button">Garage</button>
        <button class="ghost-btn" id="btn-naija" type="button">Naija Challenge</button>
      </div>

      <div class="loading-bar"><div class="loading-progress" id="loading-progress"></div></div>

      <div class="controls">
        <span class="control-key">W gas</span>
        <span class="control-key">S brake</span>
        <span class="control-key">A D steer</span>
        <span class="control-key">R radio</span>
      </div>
      <div class="developer">Ruffneck Entertainment</div>
    </div>
  </div>

  <div id="game-container">
    <canvas id="c"></canvas>
  </div>

  <script type="module">
    document.getElementById("btn-garage")?.addEventListener("click", () => {
      window.dispatchEvent(new CustomEvent("kano:open-garage"));
    });
    document.getElementById("btn-naija")?.addEventListener("click", () => {
      window.dispatchEvent(new CustomEvent("kano:open-naija"));
    });
  </script>
  <script type="module" src="/js/core/Main.js"></script>
</body>
</html>
